<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Model Lab</title>

    <link
        rel="stylesheet"
        href="../css/main.css"
    >

</head>


<body>

<div class="page">


    <div class="page-header">

        <span class="badge">
            MACHINE LEARNING LAB
        </span>

        <h1>
            Model Lab
        </h1>

        <p>
            Inspect the machine-learning model
            powering StudentAI.
        </p>

    </div>


    <div
        id="model-hero"
        class="model-hero"
    >

        <h2 id="model-name">
            Loading model...
        </h2>

        <p>
            StudentAI machine-learning model
            information.
        </p>

    </div>


    <div class="card">

        <h2>
            🧬 Model Features
        </h2>

        <div id="features">
            Loading...
        </div>

    </div>


    <br>


    <div class="card">

        <h2>
            📈 Feature Importance
        </h2>

        <div id="importance">
            Loading...
        </div>

    </div>


</div>


<script src="../js/model.js"></script>
<script src="../js/theme.js"></script>
</body>

</html>
